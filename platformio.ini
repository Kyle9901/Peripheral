; PlatformIO 配置 — InstaCare Peripheral
; 用法: pio run -e esp32s3 -t upload && pio device monitor

[platformio]
src_dir = main

; ============================================================
; ESP32-S3 N8R2（推荐）
; 双核 240MHz / BLE 5 硬件支持 / 8MB Flash / 2MB PSRAM
; ============================================================
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; Flash 8MB + PSRAM 2MB（OPI 模式）
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

; USB CDC 串口（S3 内置 USB Serial/JTAG）
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; BLE 配置
board_build.esp-idf.sdkconfig_append = sdkconfig.pio

; ============================================================
; ESP32-WROOM-32（备选）
; 双核 240MHz / BLE 5 软件支持 / 4MB Flash
; ============================================================
[env:esp32]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.flash_mode = dio
board_build.flash_size = 4MB

board_build.esp-idf.sdkconfig_append = sdkconfig.pio
